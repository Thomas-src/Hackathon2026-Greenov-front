services:

  app:
    image: registry.redyd.dev/jeuxrenov-front:latest
    container_name: jeuxrenov-front
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_BASE_URL=https://jeuxrenov.redyd.dev/
    ports:
      - "8081:3000"
    networks:
      - proxy

networks:
  proxy:
    external: true